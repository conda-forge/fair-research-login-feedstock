schema_version: 1

context:
  name: fair-research-login
  version: 0.3.1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: eeccc8c77e509fa18e3940fa12c09822aaa68bae6dae9f481426ed3d4f469cc0

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - globus-sdk <4.0.0,>=3

tests:
  - python:
      imports:
        - fair_research_login
      python_version: ${{ python_min }}.*
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Provides Native App login and token storage for multiple providers
  description: |
    This package makes writing Globus scripts and clients a
    breeze! Easily setup token management and local server
    login with a few lines of code. Easily extend components
    as your app grows and requires its own config.
  homepage: https://github.com/fair-research/native-login
  repository: https://github.com/fair-research/native-login
  documentation: https://github.com/fair-research/native-login

extra:
  recipe-maintainers:
    - jan-janssen
